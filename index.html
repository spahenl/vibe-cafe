<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>
  <!-- CSS 스타일시트 연결 (디자인 미적용) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- [페이지 상단] 카페 헤더 정보 -->
  <header>
    <div class="logo">☕</div>
    <h1>바이브 카페</h1>
    <p>당신의 하루에 바이브를 더하다</p>
  </header>

  <main>
    <!-- 주문서 폼 (JS 유효성 검사를 위해 novalidate 속성 부여) -->
    <form id="orderForm" novalidate>
      <!-- 1. 이름 (필수, text) -->
      <div>
        <label for="customerName">이름</label>
        <input type="text" id="customerName" name="customerName" required>
      </div>

      <!-- 2. 전화번호 (tel) -->
      <div>
        <label for="customerPhone">전화번호</label>
        <input type="tel" id="customerPhone" name="customerPhone">
      </div>

      <!-- 3. 음료 선택 (드롭다운) -->
      <div>
        <label for="beverage">음료 선택</label>
        <select id="beverage" name="beverage">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <option value="americano" data-price="3500">아메리카노 (3,500원)</option>
          <option value="latte" data-price="4000">카페라떼 (4,000원)</option>
          <option value="mocha" data-price="4500">카페모카 (4,500원)</option>
          <option value="vanillaLatte" data-price="4500">바닐라라떼 (4,500원)</option>
          <option value="greenTeaLatte" data-price="4500">녹차라떼 (4,500원)</option>
        </select>
      </div>

      <!-- 4. 사이즈 선택 (라디오 버튼) -->
      <fieldset>
        <legend>사이즈</legend>
        <div>
          <input type="radio" id="sizeS" name="size" value="S" data-price="0">
          <label for="sizeS">S (+0원)</label>
        </div>
        <div>
          <input type="radio" id="sizeM" name="size" value="M" data-price="500" checked>
          <label for="sizeM">M (+500원)</label>
        </div>
        <div>
          <input type="radio" id="sizeL" name="size" value="L" data-price="1000">
          <label for="sizeL">L (+1,000원)</label>
        </div>
      </fieldset>

      <!-- 5. 추가 옵션 (체크박스) -->
      <fieldset>
        <legend>추가 옵션</legend>
        <div>
          <input type="checkbox" id="optionShot" name="extraOptions" value="shot" data-price="500">
          <label for="optionShot">샷 추가 (+500원)</label>
        </div>
        <div>
          <input type="checkbox" id="optionCream" name="extraOptions" value="cream" data-price="500">
          <label for="optionCream">크림 추가 (+500원)</label>
        </div>
        <div>
          <input type="checkbox" id="optionSyrup" name="extraOptions" value="syrup" data-price="300">
          <label for="optionSyrup">시럽 추가 (+300원)</label>
        </div>
        <div>
          <input type="checkbox" id="optionDecaf" name="extraOptions" value="decaf" data-price="0">
          <label for="optionDecaf">디카페인 (+0원)</label>
        </div>
      </fieldset>

      <!-- 6. 수량 (number, 최소 1, 최대 10, 기본값 1) -->
      <div>
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <!-- 7. 요청사항 (textarea) -->
      <div>
        <label for="requests">요청사항</label>
        <textarea id="requests" name="requests" rows="4"></textarea>
      </div>

      <!-- 8. 예상 금액 표시 영역 -->
      <div id="estimatedPriceArea">
        예상 금액: <span id="estimatedPrice">0</span>원
      </div>

      <!-- 9 & 10. 주문하기 및 다시 작성 버튼 -->
      <div>
        <button type="submit" id="submitBtn">주문하기</button>
        <button type="reset" id="resetBtn">다시 작성</button>
      </div>
    </form>

    <!-- 11. 주문 확인 메시지가 나올 빈 영역 (초기 숨김) -->
    <div id="orderConfirmation" hidden></div>
  </main>

  <!-- Supabase JS v2 CDN 라이브러리 연결 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 사용자 정의 자바스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
